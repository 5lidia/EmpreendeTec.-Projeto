<label>Nome *<input name="nome" required value="{{ v.nome or '' }}"></label>
<label>Turma *<input name="turma" required value="{{ v.turma or '' }}"></label>
<label>E-mail *<input name="email" type="email" required value="{{ v.email or '' }}"></label>
<label>Telefone *<input name="telefone" required value="{{ v.telefone or '' }}"></label>
<label>Nome da loja<input name="loja" value="{{ v.loja or '' }}"></label>
<label>Usuário *<input name="usuario" required value="{{ v.usuario or '' }}"></label>
<label>Foto<input type="file" name="foto" accept="image/*"></label>
